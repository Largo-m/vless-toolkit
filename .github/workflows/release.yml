name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check version matches tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          import vless_toolkit

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          assert tag == project_version == vless_toolkit.__version__, (
              tag,
              project_version,
              vless_toolkit.__version__,
          )
          print(f"version {tag} matches tag and package metadata")
          PY
      - name: Smoke-test wheel
        run: |
          python -m pip install dist/*.whl
          vless-toolkit --version
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
