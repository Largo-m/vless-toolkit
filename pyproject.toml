[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vless-toolkit"
version = "1.0.0"
description = "Parse, validate, build and convert VLESS, VMess, Trojan and Shadowsocks share links and base64 subscriptions - offline, with zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Largo-m" }]
requires-python = ">=3.9"
keywords = [
  "vless",
  "vmess",
  "trojan",
  "shadowsocks",
  "v2ray",
  "xray",
  "subscription",
  "share-link",
  "proxy",
  "cli",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Security",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pre-commit>=3.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
vless-toolkit = "vless_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Largo-m/vless-toolkit"
Repository = "https://github.com/Largo-m/vless-toolkit"
Documentation = "https://github.com/Largo-m/vless-toolkit/blob/main/docs/API.md"
Issues = "https://github.com/Largo-m/vless-toolkit/issues"
Changelog = "https://github.com/Largo-m/vless-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["vless_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["vless_toolkit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "DTZ", "RUF"]
ignore = ["DTZ005", "DTZ006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
